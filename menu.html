<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Меню - Fast Delifood</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg sticky-top" id="navbar-settings">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html"><img src="images/fd_logo.png" alt="FD" width="50" height="50"></a>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav mx-auto">
                        <a class="nav-link custom-link fs-4 active" href="menu.html">Меню</a>
                        <a class="nav-link custom-link fs-4" href="index.html#feedback">Зворотній звязок</a>
                        <a class="nav-link custom-link fs-4" href="index.html#whats-new">Новини</a>
                        <a class="nav-link custom-link fs-4" href="index.html#about-us">Про нас</a>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3 ms-lg-auto justify-content-center mt-3 mt-lg-0">
                    <button id="theme-toggle" class="d-flex align-items-center justify-content-center border-0 bg-transparent" title="Змінити тему"> <img id="theme-icon" src="images/панель/light_theme.png" alt="Тема"></button>
                    <div class="navbar-basket" id="basket-container">
                        <a class="basket-link" href="#"></a>
                        <span id="cart-badge" class="cart-badge">0</span>
                        <img id="basket-icon" src="images/панель/basket.png" alt="Кошик">
                    </div>
                </div>
            </div>
        </nav>

        <div id="cart-overlay" class="cart-overlay"></div>
        <aside id="cart-panel" class="cart-panel">
            <div class="cart-panel-header">
                <h2>Кошик</h2>
                <button id="cart-close-btn" type="button" class="cart-close-btn" aria-label="Закрити кошик">×</button>
            </div>
            <div id="cart-items" class="cart-items"></div>
            <div id="cart-empty-message" class="cart-empty-message">В кошику поки що немає товарів.</div>
            <div class="cart-summary">
                <span>Всього до оплати:</span>
                <span id="cart-total">0 грн</span>
            </div>
            <button id="checkout-btn" class="btn btn-purple w-100 rounded-3">Оформити замовлення</button>
        </aside>

        <div id="order-modal-overlay" class="modal-overlay" aria-hidden="true">
            <div class="order-modal">
                <button id="order-modal-close-btn" type="button" class="order-modal-close" aria-label="Закрити">×</button>
                <div class="order-modal-icon">✓</div>
                <h3>Дякуємо за замовлення!</h3>
                <p>Менеджер зв'яжеться з вами найближчим часом.</p>
            </div>
        </div>

        <div class="container py-5">
            <h1 id="titles-h3" class="text-center fw-bold mb-5">Наше Меню</h1>
            
            <div class="row mb-4">
                <div class="col">
                    <div id="catalog-categories" class="d-flex flex-wrap gap-2 justify-content-center category-tabs"></div>
                </div>
            </div>
            <div class="row g-4 row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4" id="catalog-items"></div>
        </div>

        <footer id="basement" class="mt-5">
            <div class="container py-4 d-flex flex-column flex-md-row justify-content-between align-items-center gap-4">
                <div class="footer-logo">
                    <a href="index.html"><img src="images/fd_logo.png" alt="Fast Delifood Logo" width="70"></a>
                </div>
                <div class="footer-menu d-flex flex-column text-center">
                    <a class="footer-link fs-5 mb-2" href="menu.html">Меню</a>
                    <a class="footer-link fs-5 mb-2" href="index.html#whats-new">Новини</a>
                    <a class="footer-link fs-5 mb-2" href="index.html#about-us">Про нас</a>
                    <a class="footer-link fs-5" href="index.html#feedback">Зворотній зв'язок</a>
                </div>
                <div class="footer-social d-flex gap-3">
                    <a href="#"><img src="images/підвал/facebook.png" alt="Facebook" class="social-icon"></a>
                    <a href="#"><img src="images/підвал/x.png" alt="X" class="social-icon"></a>
                    <a href="#"><img src="images/підвал/youtube.png" alt="YouTube" class="social-icon"></a>
                    <a href="#"><img src="images/підвал/tiktok.png" alt="TikTok" class="social-icon"></a>
                </div>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
